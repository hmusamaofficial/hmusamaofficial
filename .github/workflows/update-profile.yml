name: Refresh profile assets

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-assets
  cancel-in-progress: false

jobs:
  update-profile:
    if: github.repository == 'hmusamaofficial/hmusamaofficial'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh professional footprint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Generate static streak statistics
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=0D1117&stroke=58A6FF&ring=58A6FF&fire=FF6B6B&currStreakLabel=58A6FF
          path: assets/streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated streak statistics
        run: |
          test -s assets/streak-stats.svg
          if grep -Eqi 'error|failed|rate.?limit|PAT_1|maximum retries|something went wrong' assets/streak-stats.svg; then
            echo "Generated streak SVG contains an error response."
            exit 1
          fi

      - name: Commit and push changed profile assets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md assets/streak-stats.svg; then
            echo "Profile assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md assets/streak-stats.svg
          git diff --cached --check
          git commit -m "chore: refresh profile assets"
          git push origin "HEAD:${DEFAULT_BRANCH}"
